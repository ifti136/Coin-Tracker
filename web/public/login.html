<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Coin Tracker</title>

  <link rel="icon" href="/images/coin.ico">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#E8B84A">

  <script>
    (function() {
      try {
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        screens: { sm: '600px', md: '768px', lg: '1024px', xl: '1280px' },
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Sora', 'Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace']
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="/css/base.css">
</head>
<body class="font-sans text-[var(--text-primary)] bg-[var(--canvas)] text-sm m-0 p-0 min-h-screen">

  <a href="#auth-form" class="skip-link">Skip to sign-in form</a>

  <div class="min-h-screen flex flex-col">
    <header class="flex items-center justify-between gap-4 px-5 sm:px-8 py-4">
      <div class="flex items-center gap-3">
        <span class="w-9 h-9 rounded-lg bg-[var(--brand)] text-[var(--on-brand)] flex items-center justify-center font-display font-bold text-base shrink-0" aria-hidden="true">C</span>
        <span class="font-display font-bold text-lg text-[var(--text-primary)]">Coin Tracker</span>
      </div>
      <button type="button" id="themeToggleBtn" aria-label="Toggle dark mode" class="btn ghost w-11 h-11 !p-0">
        <span aria-hidden="true"></span>
      </button>
    </header>

    <main id="main-content" role="main" class="flex-1 flex justify-center px-5 pb-10 pt-2 sm:pt-8">
      <div class="w-full max-w-[420px] lg:max-w-[440px]">
        <section id="auth-form" class="auth-card card p-6 sm:p-8" aria-labelledby="auth-title" tabindex="-1">
          <div class="mb-6">
            <h1 id="auth-title" class="font-display text-2xl font-bold m-0">Login</h1>
            <p class="muted-text mt-1 mb-0">Sign in to continue tracking your coins.</p>
          </div>

          <div class="field mb-4">
            <label for="username" class="field-label">Username</label>
            <input type="text" id="username" autocomplete="username" placeholder="Enter username" aria-describedby="auth-error">
          </div>

          <div class="field mb-4" id="confirmPasswordGroup" style="display:none;">
            <label for="confirmPassword" class="field-label">Confirm password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Confirm password" aria-describedby="auth-error">
          </div>

          <div class="field mb-3">
            <label for="password" class="field-label">Password</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="Enter password" aria-describedby="auth-error">
          </div>

          <p id="auth-error" class="field-error min-h-[20px] mb-1" role="alert" aria-live="polite"></p>

          <div class="flex flex-col gap-2 mt-2">
            <button type="button" id="auth-submit-btn" class="btn primary w-full">Login</button>
            <button type="button" id="auth-toggle-btn" class="btn ghost w-full">Need an account? Register</button>
          </div>
        </section>

        <p class="muted-text text-center mt-5 mb-0">Your data stays synced with your Coin Tracker account.</p>
      </div>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/js/login.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('[SW] Registered:', registration.scope);
          })
          .catch((error) => {
            console.log('[SW] Registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
