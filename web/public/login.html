<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coin Tracker</title>

    <link rel="icon" href="/images/coin.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">

    <script>
        (function() {
            try {
                const theme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          }
        }
      }
    </script>

    <link rel="stylesheet" href="/css/base.css">
</head>
<body class="flex justify-center items-center min-h-screen p-4">

  <button id="themeToggleBtn"
    aria-label="Toggle dark mode"
    class="fixed top-5 right-5 w-[42px] h-[42px] rounded-full border flex items-center justify-center cursor-pointer transition-all duration-200 z-10
           border-[var(--outline)] bg-[var(--surface-color)] text-[var(--on-surface)] hover:bg-[var(--surface-variant)] hover:scale-110">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>

  <main id="main-content" role="main" class="w-full max-w-[480px] lg:max-w-[520px]">
    <div class="auth-card bg-[var(--surface-color)] border border-[var(--outline)] rounded-2xl px-7 py-9 shadow-[var(--shadow-lg)] w-full sm:w-[90%] mx-auto">

      <div class="flex items-center gap-3 text-xl font-bold text-[var(--on-bg-color)] justify-center mb-6">
        <div class="w-9 h-9 bg-amber-400 rounded-[10px] flex items-center justify-center text-white font-extrabold text-lg">C</div>
        <span>Coin Tracker</span>
      </div>

      <h2 id="auth-title" class="text-center text-2xl font-bold text-[var(--on-bg-color)] mb-6">Login</h2>

      <div class="mb-4">
        <label for="username" class="block mb-1.5 font-medium text-sm text-[var(--on-bg-color)]">Username</label>
        <input type="text" id="username" autocomplete="username" placeholder="Enter username"
          class="w-full px-3.5 py-[11px] rounded-[10px] border border-[var(--outline)] bg-[var(--surface-variant)] text-[var(--on-surface)] text-sm font-[inherit] transition-colors duration-200
                 focus:border-[var(--primary-color)] focus:outline-[2px] focus:outline-[var(--primary-color)] focus:outline-offset-2">
      </div>

      <div class="mb-4" id="confirmPasswordGroup" style="display:none;">
        <label for="confirmPassword" class="block mb-1.5 font-medium text-sm text-[var(--on-bg-color)]">Confirm Password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Confirm password"
          class="w-full px-3.5 py-[11px] rounded-[10px] border border-[var(--outline)] bg-[var(--surface-variant)] text-[var(--on-surface)] text-sm font-[inherit] transition-colors duration-200
                 focus:border-[var(--primary-color)] focus:outline-[2px] focus:outline-[var(--primary-color)] focus:outline-offset-2">
      </div>

      <div class="mb-4">
        <label for="password" class="block mb-1.5 font-medium text-sm text-[var(--on-bg-color)]">Password</label>
        <input type="password" id="password" autocomplete="current-password" placeholder="Enter password"
          class="w-full px-3.5 py-[11px] rounded-[10px] border border-[var(--outline)] bg-[var(--surface-variant)] text-[var(--on-surface)] text-sm font-[inherit] transition-colors duration-200
                 focus:border-[var(--primary-color)] focus:outline-[2px] focus:outline-[var(--primary-color)] focus:outline-offset-2">
      </div>

      <p id="auth-error" class="text-[var(--error-color)] text-[13px] min-h-[20px] text-center mb-1"></p>

      <div class="flex flex-col gap-2.5 mt-3">
        <button id="auth-submit-btn"
          class="btn primary w-full py-3 rounded-[10px] font-semibold text-sm bg-[var(--primary-color)] text-white border-0 cursor-pointer hover:opacity-90 active:scale-[0.98] disabled:opacity-70 disabled:cursor-wait transition-all">
          Login
        </button>
        <button id="auth-toggle-btn"
          class="bg-none border-0 text-[var(--primary-color)] font-medium cursor-pointer text-[13px] font-[inherit] text-center py-1 hover:underline">
          Need an account? Register
        </button>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/js/login.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((registration) => {
            console.log('[SW] Registered:', registration.scope);
          })
          .catch((error) => {
            console.log('[SW] Registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
