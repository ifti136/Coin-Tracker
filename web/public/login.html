<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coin Tracker</title>

    <link rel="icon" href="/images/coin.ico">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#3b82f6">

    <!-- Prevent theme flash -->
    <script>
        (function() {
            try {
                const theme = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

    <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle dark mode"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></button>

    <main id="main-content" role="main">
    <div class="auth-card">
        <div class="logo">
            <div class="coin-icon">C</div>
            <span>Coin Tracker</span>
        </div>
        <h2 id="auth-title">Login</h2>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" placeholder="Enter username">
        </div>
        <div class="form-group" id="confirmPasswordGroup" style="display:none;">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" autocomplete="new-password" placeholder="Confirm password">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" placeholder="Enter password">
        </div>

        <p id="auth-error" class="auth-error"></p>

        <div class="auth-buttons">
            <button id="auth-submit-btn" class="btn primary">Login</button>
            <button id="auth-toggle-btn" class="btn-link">Need an account? Register</button>
        </div>
    </div>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <!-- Firebase SDK -->
    <script type="module" src="/js/login.js"></script>
    <script>
      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('[SW] Registered:', registration.scope);
            })
            .catch((error) => {
              console.log('[SW] Registration failed:', error);
            });
        });
      }
    </script>
</body>
</html>
